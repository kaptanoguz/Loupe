[workspace]
resolver = "3"
members = [
    "crates/loupe-core",
    "crates/loupe-db",
    "crates/loupe-storage",
    "crates/loupe-media",
    "crates/loupe-jobs",
    "crates/loupe-ai",
    "crates/loupe-search",
    "crates/loupe-lan",
    "crates/loupe-cloud",
    "crates/loupe-app",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/kaptanoguz/Magic-Photo"

[workspace.dependencies]
loupe-core = { path = "crates/loupe-core" }
loupe-db = { path = "crates/loupe-db" }
loupe-storage = { path = "crates/loupe-storage" }
loupe-media = { path = "crates/loupe-media" }
loupe-jobs = { path = "crates/loupe-jobs" }
loupe-ai = { path = "crates/loupe-ai" }
loupe-search = { path = "crates/loupe-search" }
loupe-lan = { path = "crates/loupe-lan" }
loupe-cloud = { path = "crates/loupe-cloud" }
loupe-app = { path = "crates/loupe-app" }

age = { version = "0.11", default-features = false }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "tokio", "json"] }
base64 = "0.22"
blake3 = "1.8"
bytes = "1"
flate2 = "1"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
md-5 = "0.10"
mdns-sd = "0.13"
rand = "0.9"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
# Bulut ve LAN istemcileri: TLS sağlayıcı (ring) ve kök sertifikalar elle verilir.
reqwest = { version = "0.12", default-features = false, features = ["http2", "stream", "rustls-tls-manual-roots-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = "1"
rusty-s3 = "0.8"
sha1 = "0.10"
sha2 = "0.10"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
url = "2"
webpki-roots = "1"
zeroize = "1"
http = "1"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false }
# Linux Secret Service (GNOME Keyring / KWallet) DBus istemcisi; saf Rust (zbus, kendi yürütücüsü), libdbus gerekmez.
secret-service = { version = "5", features = ["rt-async-io-crypto-rust"] }
kamadak-exif = "0.6"
quick-xml = "0.38"
rstar = "0.12"
webp = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
notify-debouncer-full = "0.7"
# Gerçek çıkarım (loupe-ai `ort` özelliği): ONNX Runtime çalışma anında dlopen ile yüklenir,
# derleme sırasında ikili indirilmez.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }
rusqlite = { version = "0.41", features = ["bundled", "hooks", "functions"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite-vec = "0.1.9"
tempfile = "3"
thiserror = "2"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# Üretim kodunda panik yok: unwrap/expect/panic derlemeyi kırar.
# Testlerde serbest (clippy.toml: allow-*-in-tests).
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.lints.rust]
# Tek istisna: sqlite-vec'in statik kaydı (loupe-db/src/vec_ext.rs).
unsafe_code = "deny"
missing_debug_implementations = "warn"

[profile.dev.package."*"]
# SQLite, BLAKE3 ve görüntü çözme testlerde de hızlı çalışsın.
opt-level = 2
