name: ci

on:
  push:
    branches: [main]
  pull_request:

# Aynı dal için yeni bir push eski çalıştırmayı iptal eder.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Hata ayıklama bilgisi CI'da kullanılmıyor: daha hızlı bağlama, daha küçük önbellek.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

# Rust üç paralel işe bölünür; her biri kendi önbelleğini tutar.
jobs:
  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sürüm rust-toolchain.toml'dan gelir; yerel ve CI aynı clippy'yi kullanır.
      - run: rustup show active-toolchain
      # Tauri v2 masaüstü kabuğu (WebKitGTK 4.1) için sistem kütüphaneleri.
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          librsvg2-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          cache-on-failure: true
      # generate_context! frontendDist klasörünün var olmasını bekler; arayüz ayrı işte derlenir.
      - run: mkdir -p apps/desktop/dist
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Gerçek ONNX modelleri: ONNX Runtime dlopen ile yüklenir, derlemede ikili indirilmez.
      - run: cargo clippy -p loupe-ai --features ort --all-targets --locked -- -D warnings
      # Uygulama katmanının ONNX yolu (AiMode::Onnx) da derlenir ve lint'lenir.
      - run: cargo clippy -p loupe-app --features ort --all-targets --locked -- -D warnings
      # mDNS olmadan (yalnızca bellek içi keşif) da derlenmeli.
      - run: cargo clippy -p loupe-lan --no-default-features --all-targets --locked -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
          librsvg2-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          cache-on-failure: true
      - run: mkdir -p apps/desktop/dist
      - run: cargo test --workspace --locked

  rust-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      # İsteğe bağlı libvips arka ucu; video küçük resmi ve metadata için ffmpeg.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-tools ffmpeg
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: features
          cache-on-failure: true
      - run: cargo test -p loupe-ai --features ort --lib --locked
      - run: cargo test -p loupe-media --features vips --locked
      # Kayıpsız (saf Rust) WebP yolu.
      - run: cargo test -p loupe-media --no-default-features --locked
      - run: cargo test -p loupe-lan --no-default-features --locked

  # The Rust workspace must also compile on the platforms we ship installers for.
  rust-cross:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cross
          cache-on-failure: true
      - run: mkdir -p apps/desktop/dist
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p loupe-desktop --features ort --locked -- -D warnings
      - run: cargo test -p loupe-storage -p loupe-core --locked

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sqlite-vec
      - run: python3 tools/schema-check/check_schema.py crates/loupe-db/migrations

  slop-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/slop-guard/slop-guard.sh
      - run: bash tools/slop-guard/slop-guard.sh crates/loupe-lan/web
