name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sürüm rust-toolchain.toml'dan gelir; yerel ve CI aynı clippy'yi kullanır.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # İsteğe bağlı libvips arka ucu ve kayıpsız (saf Rust) WebP yolu.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-tools
      - run: cargo test -p loupe-media --features vips --locked
      - run: cargo test -p loupe-media --no-default-features --locked

  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install sqlite-vec
      - run: python3 tools/schema-check/check_schema.py crates/loupe-db/migrations

  slop-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/slop-guard/slop-guard.sh
