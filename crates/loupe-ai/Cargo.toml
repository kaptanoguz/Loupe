[package]
name = "loupe-ai"
description = "Loupe çevrimdışı AI motoru: yüz tespiti ve kişi kümeleme, çok dilli CLIP vektörleri, zaman-konum etkinlik algılama"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Gerçek modeller: SCRFD (yüz tespiti), ArcFace (yüz vektörü), M-CLIP (görüntü + çok dilli metin).
# ONNX Runtime paylaşımlı kütüphanesi çalışma anında `ORT_DYLIB_PATH` ile bulunur.
ort = ["dep:ort", "dep:tokenizers"]

[dependencies]
blake3.workspace = true
flate2.workspace = true
futures-util.workspace = true
image.workspace = true
loupe-core.workspace = true
loupe-db.workspace = true
loupe-jobs.workspace = true
loupe-media.workspace = true
ort = { workspace = true, optional = true }
reqwest.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokenizers = { workspace = true, optional = true }
tokio.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
axum.workspace = true
bytes.workspace = true
tempfile.workspace = true

[[bin]]
name = "loupe-models"
path = "src/bin/loupe-models.rs"

[lints]
workspace = true
